name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: |
          npm run build
          mkdir server_deploy
          cp server.js package.json package-lock.json server_deploy/

      - name: Deploy Frontend
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.FRONTEND_TARGET }}
          ARGS: "-rltgoDzvO --delete"

      - name: Deploy Backend
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SOURCE: "server_deploy/"
          TARGET: ${{ secrets.BACKEND_TARGET }}
          ARGS: "-rltgoDzvO"

      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            echo "Using Node version: $(node -v)"
            
            cd ${{ secrets.BACKEND_TARGET }}
            
            # Install production dependencies
            npm install --omit=dev
            
            # --- CONFIGURATION ---
            APP_NAME="${{ secrets.APP_NAME }}"
            PORT="${{ secrets.APP_PORT }}"
            HOST="127.0.0.1"

            # Check if process exists under THIS user (deploy)
            if pm2 list | grep -q "$APP_NAME"; then
                echo "Restarting $APP_NAME on $HOST:$PORT..."
                HOST=$HOST PORT=$PORT pm2 restart $APP_NAME --update-env
            else
                echo "Starting $APP_NAME on $HOST:$PORT..."
                HOST=$HOST PORT=$PORT pm2 start server.js --name "$APP_NAME"
            fi
            
            pm2 save
